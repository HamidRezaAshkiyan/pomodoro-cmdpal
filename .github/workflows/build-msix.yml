name: Build and Release MSIX

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run Core Unit Tests
        run: dotnet test tests/PomodoroCmdPal.Core.Tests/PomodoroCmdPal.Core.Tests.csproj -c Release --verbosity normal

      - name: Create Self-Signed Dev Certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".certs" | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=PomodoroCmdPalDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "PomodoroCmdPal Dev Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath ".certs\PomodoroCmdPalDev.cer" | Out-Null
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSIX (x64 & ARM64)
        shell: pwsh
        run: |
          $thumbprint = $env:CERT_THUMBPRINT
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item ".certs\PomodoroCmdPalDev.cer" "release-assets\PomodoroCmdPalDev.cer"
          Copy-Item "scripts\install-from-release.ps1" "release-assets\install-from-release.ps1"

          foreach ($arch in @("x64", "ARM64")) {
            Write-Host "=== Building $arch ==="
            dotnet build src/PomodoroCmdPal/PomodoroCmdPal.csproj `
              -c Release `
              -p:Platform=$arch `
              -p:GenerateAppxPackageOnBuild=true `
              -p:AppxPackageSigningEnabled=true `
              -p:PackageCertificateThumbprint="$thumbprint"

            if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed for $arch"
            }

            $msix = Get-ChildItem -Path "src/PomodoroCmdPal/AppPackages" -Filter "*$arch*.msix" -Recurse |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if (-not $msix) {
              $msix = Get-ChildItem -Path "src/PomodoroCmdPal/AppPackages" -Filter "*.msix" -Recurse |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
            }

            if (-not $msix) {
              throw "MSIX output missing for $arch"
            }

            $sig = Get-AuthenticodeSignature -FilePath $msix.FullName
            Write-Host "$arch MSIX signature status: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) {
              throw "MSIX package for $arch is not signed!"
            }

            Copy-Item $msix.FullName "release-assets\PomodoroCmdPal-$arch.msix"
          }

          Get-ChildItem "release-assets"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroCmdPal-MSIX
          path: release-assets/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Minimal Pomodoro Timer for Windows 11 PowerToys Command Palette Dock

            **Features:**
            - **Live Color-Coded Progress Ring Icon** directly in the PowerToys Command Palette Dock (Coral Red for Focus, Mint Teal for Short Break, Calm Indigo for Long Break, Warm Amber when Paused)
            - Live `MM:SS` countdown & cycle counter (`Focus • 1/4`)
            - **Native Command Palette Settings** for custom Focus / Short Break / Long Break durations, cycles, auto-start next phase, and completion sound toggle
            - **Quick Presets:** Classic (`25/5/15`), Deep Work (`50/10/20`), and Sprint (`15/3/10`)
            - **`+5 min` Extend** right from the Dock context menu or completion toast
            - **Interactive Windows 11 Toast Notifications** with clickable **Start Break / Start Focus** and **+5 min Focus** buttons
            - **Persisted Daily Focus Stats** (`Today: N sessions • Xm focused`)

            **Quick Install (Windows 11 + PowerToys 0.98+):**
            1. Download `PomodoroCmdPal-x64.msix` (or `ARM64`), `PomodoroCmdPalDev.cer`, and `install-from-release.ps1` into the same folder.
            2. Run PowerShell as Administrator in that folder and execute:
               ```powershell
               .\install-from-release.ps1
               ```
            3. Open **PowerToys Settings → Command Palette → Dock**, enable the Dock, and pin **Pomodoro Timer**.
          files: |
            release-assets/PomodoroCmdPal-x64.msix
            release-assets/PomodoroCmdPal-ARM64.msix
            release-assets/PomodoroCmdPalDev.cer
            release-assets/install-from-release.ps1
